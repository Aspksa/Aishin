name: Aishin Runtime Check

on:
  push:
    branches: [main, release/00.00.16-digital-organism-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aishin-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app scripts

      - name: Check browser JavaScript
        run: node --check app/static/app.js && node --check app/static/live_brain.js && node --check app/static/growth.js && node --check app/static/intelligence.js && node --check app/static/proactive_intelligence.js && node --check app/static/evolution.js && node --check app/static/research.js && node --check app/static/communication.js && node --check app/static/documents.js

      - name: UI contract check
        run: python scripts/ui_contract_check.py

      - name: Check updater module
        run: python -m py_compile app/updater.py app/system_settings.py

      - name: Core self-check
        run: python scripts/self_check.py

      - name: FastAPI runtime smoke
        run: python scripts/runtime_smoke.py

      - name: Install browser QA dependency
        if: runner.os == 'Linux'
        run: python -m pip install "selenium>=4.26,<5"

      - name: Browser visual smoke
        if: runner.os == 'Linux'
        run: python scripts/browser_ui_smoke.py

      - name: Upload browser visual artifacts
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-${{ github.sha }}
          path: artifacts/browser-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Launcher check-only
        if: runner.os == 'Windows'
        shell: cmd
        run: Aishin.bat --check-only
